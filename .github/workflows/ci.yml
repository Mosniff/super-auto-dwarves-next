name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # npm ci runs postinstall (prisma generate), which needs no database.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:coverage
